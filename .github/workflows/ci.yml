name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate pull-request branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s\n' "$HEAD_BRANCH" | grep -Eq '^dependabot/'; then
            exit 0
          fi
          printf '%s\n' "$HEAD_BRANCH" | \
            grep -Eq '^(feature|fix)/[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$'

      - name: Validate commit message
        if: github.actor != 'dependabot[bot]'
        run: python3 scripts/validate-commit-message.py "$(git log -1 --pretty=%B)"

      - name: Check whitespace
        run: git diff --check HEAD^
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'

      - name: Parse shell scripts
        run: |
          bash -n install.sh
          bash -n bin/dot-shell
          bash -n scripts/package-release.sh
          bash -n scripts/configure-github.sh
          bash -n scripts/bootstrap-spec-kit.sh
          bash -n tests/test-cli.sh
          python3 -m py_compile scripts/validate-commit-message.py

      - name: Test CLI contract
        run: tests/test-cli.sh

      - name: Validate repository policy files
        run: |
          test -s AGENTS.md
          test -s LICENSE
          test -s docs/product-vision.md
          test -s docs/interaction-model.md
          test -s docs/release-process.md
          grep -F 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -F 'Version 3, 29 June 2007' LICENSE
