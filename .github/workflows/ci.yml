name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Validate pull-request branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s\n' "$HEAD_BRANCH" | grep -Eq '^dependabot/'; then
            exit 0
          fi
          printf '%s\n' "$HEAD_BRANCH" | \
            grep -Eq '^(feature|fix)/[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$'

      - name: Validate commit message
        if: github.actor != 'dependabot[bot]'
        run: python3 scripts/validate-commit-message.py "$(git log -1 --pretty=%B)"

      - name: Check whitespace
        run: git diff --check HEAD^
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'

      - name: Parse shell scripts
        run: |
          bash -n install.sh
          bash -n bin/dot-shell
          bash -n scripts/package-release.sh
          bash -n scripts/configure-github.sh
          bash -n scripts/bootstrap-spec-kit.sh
          bash -n tests/test-cli.sh
          bash -n tests/test-commit-message.sh
          bash -n scripts/check-qml.sh
          bash -n tests/test-package.sh
          bash -n tests/test-visual-parity.sh
          python3 -m py_compile scripts/validate-commit-message.py
          python3 -m py_compile scripts/profile-osd.py
          python3 -m py_compile tests/integration/test-private-audio.py

      - name: Test CLI contract
        run: tests/test-cli.sh

      - name: Test commit-message validation
        run: tests/test-commit-message.sh

      - name: Test release package contents and checksums
        run: tests/test-package.sh

      - name: Validate repository policy files
        run: |
          test -s AGENTS.md
          test -s LICENSE
          test -s docs/product-vision.md
          test -s docs/interaction-model.md
          test -s docs/release-process.md
          grep -F 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -F 'Version 3, 29 June 2007' LICENSE

  qml:
    name: qml
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Quickshell and Qt test tools
        run: pacman -Syu --needed --noconfirm quickshell qt6-declarative ripgrep git diffutils
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Record tool versions
        run: |
          qs --version
          /usr/lib/qt6/bin/qmllint --version
      - name: Format, lint and test QML
        run: scripts/check-qml.sh
