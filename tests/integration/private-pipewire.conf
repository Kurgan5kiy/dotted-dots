# Test-only server: no ALSA, PulseAudio, session manager or hardware discovery.
context.properties = {
    core.daemon = true
    core.name = dot-shell-audio-test
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
    { name = libpipewire-module-adapter }
]
context.objects = [
    { factory = metadata args = {
        metadata.name = default
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = dot-shell-test-a
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        node.param.Props = { channelVolumes = [ 0.125 0.125 ] mute = false }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = dot-shell-test-b
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        node.param.Props = { channelVolumes = [ 0.216 0.216 ] mute = false }
    } }
]
